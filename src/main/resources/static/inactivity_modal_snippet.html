    <!-- Modal de Alerta por Inactividad -->
    <div id="inactivityModal" class="modal-backdrop" style="display: none; z-index: 10000;">
        <div class="modal" style="max-width: 420px; text-align: center; border: 1px solid var(--accent-rose); box-shadow: 0 0 25px rgba(255, 45, 85, 0.25);">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">⏳</div>
            <h3 style="color: var(--accent-rose); margin-bottom: 0.5rem; font-family: 'Inter', sans-serif;">Sesión a punto de expirar</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
                No se ha detectado actividad en los últimos <strong style="color: var(--text-main);">4 minutos y 30 segundos</strong>. Por seguridad, su sesión se cerrará en <span id="inactivityCountdown" style="color: var(--accent-cyan); font-weight: 700; font-family: 'JetBrains Mono', monospace;">30</span> segundos.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-primary" style="flex: 1; background: var(--accent-cyan); color: #090A0F; font-weight: 600;" onclick="resetInactivityTimer()">Continuar Trabajando</button>
                <button class="btn" style="flex: 1; background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);" onclick="cerrarSesionPorInactividad()">Cerrar Sesión Ahora</button>
            </div>
        </div>
    </div>
