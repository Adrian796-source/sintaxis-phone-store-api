spring.application.name=sintaxis

# ===== SERVIDOR =====
server.port=8080

# ===== BASE DE DATOS =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/sintaxisdb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===== HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== POOL DE CONEXIONES (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ===== JACKSON =====

spring.jackson.time-zone=UTC

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== JWT BLACKLIST =====
jwt.blacklist.enabled=${JWT_BLACKLIST_ENABLED:true}
jwt.blacklist.cleanup-interval=${JWT_BLACKLIST_CLEANUP:3600000}

# ===== IMAGENES =====

# Ruta para guardar imágenes
upload.path=uploads/

# Límites de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Servir archivos estáticos desde uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/

